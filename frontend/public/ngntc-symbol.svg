<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="symCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="symVioletGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#B800FF" />
    </linearGradient>
    <filter id="symGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="#0B0F19" />
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="#1E293B" stroke-width="2" />

  <polygon points="100,24 165,60 165,140 100,176 35,140 35,60" 
           fill="none" 
           stroke="url(#symCyanGrad)" 
           stroke-width="2.5" 
           stroke-dasharray="6,4" 
           opacity="0.5" />

  <circle cx="100" cy="100" r="70" 
          fill="none" 
          stroke="url(#symVioletGrad)" 
          stroke-width="1.5" 
          stroke-dasharray="8,8" 
          opacity="0.4" />

  <g id="letterN">
    <path d="M 64,142 L 64,62 L 82,51 L 82,131 Z" fill="url(#symCyanGrad)" />
    <path d="M 118,69 L 118,149 L 136,138 L 136,58 Z" fill="url(#symVioletGrad)" />
    <path d="M 64,62 L 136,138 L 118,149 L 82,51 Z" fill="url(#symCyanGrad)" opacity="0.85" />
    <path d="M 78,65 L 122,135" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#symGlow)" />
  </g>

  <circle cx="64" cy="62" r="7" fill="#00F2FE" filter="url(#symGlow)" />
  <circle cx="64" cy="142" r="6" fill="#4FACFE" />
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" filter="url(#symGlow)" />
  <circle cx="136" cy="58" r="6" fill="#B800FF" />
  <circle cx="136" cy="138" r="7" fill="#7928CA" filter="url(#symGlow)" />

  <circle cx="100" cy="24" r="4" fill="#10B981" filter="url(#symGlow)" />
  <circle cx="165" cy="100" r="4" fill="#00F2FE" filter="url(#symGlow)" />
  <circle cx="100" cy="176" r="4" fill="#B800FF" filter="url(#symGlow)" />
  <circle cx="35" cy="100" r="4" fill="#00F2FE" filter="url(#symGlow)" />
</svg>
