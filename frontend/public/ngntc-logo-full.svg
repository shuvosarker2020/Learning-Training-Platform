<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#B800FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(40, 30)">
    <polygon points="90,10 160,50 160,130 90,170 20,130 20,50" 
             fill="none" 
             stroke="url(#cyanGrad)" 
             stroke-width="2.5" 
             stroke-dasharray="6,4" 
             opacity="0.4" />
    <circle cx="90" cy="90" r="76" 
            fill="none" 
            stroke="url(#violetGrad)" 
            stroke-width="1.5" 
            stroke-dasharray="8,8" 
            opacity="0.5" />
    <path d="M 52,135 L 52,50 L 72,38 L 72,123 Z" fill="url(#cyanGrad)" filter="url(#subtleGlow)" opacity="0.95" />
    <path d="M 108,55 L 108,142 L 128,130 L 128,43 Z" fill="url(#violetGrad)" filter="url(#subtleGlow)" opacity="0.95" />
    <path d="M 52,50 L 128,130 L 108,142 L 72,38 Z" fill="url(#cyanGrad)" opacity="0.85" />
    <path d="M 68,54 L 114,124" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="52" cy="50" r="7" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="52" cy="135" r="6" fill="#4FACFE" />
    <circle cx="90" cy="90" r="8" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="128" cy="43" r="6" fill="#B800FF" />
    <circle cx="128" cy="130" r="7" fill="#7928CA" filter="url(#glow)" />
    <circle cx="90" cy="22" r="3.5" fill="#10B981" filter="url(#glow)" />
    <circle cx="160" cy="90" r="3.5" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="90" cy="158" r="3.5" fill="#B800FF" filter="url(#glow)" />
    <circle cx="20" cy="90" r="3.5" fill="#00F2FE" filter="url(#glow)" />
  </g>

  <!-- LOGO TYPOGRAPHY & BRAND TAGLINE -->
  <g transform="translate(240, 72)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="10" cy="11" r="3" fill="#10B981" />
    <text x="20" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#00F2FE" letter-spacing="1.5">ENTERPRISE ACADEMY</text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="0.5">NEXT GENERATION</text>
    <text x="328" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="34" fill="url(#cyanGrad)" letter-spacing="0.5">NETWORK</text>
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="20" fill="#94A3B8" letter-spacing="6">TRAINING CENTRE</text>
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38BDF8" letter-spacing="1">AI &amp; ML  •  5G/6G NETWORKS  •  CLOUD SYSTEMS  •  CYBERSECURITY  •  SOFTWARE ENG</text>
  </g>
</svg>
